name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The repository root is one level above the app, so this file lives here and every step runs in the app folder.
defaults:
  run:
    working-directory: 07ps-sales-dashboard-app

jobs:
  node:
    name: Frontend / Backend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 07ps-sales-dashboard-app/package-lock.json
      - run: npm ci || npm install
      # Non-blocking: the codebase predates the Prettier config (printWidth 100), so this fails on main for
      # files unrelated to any change. Make it blocking after a one-off `npm run format`.
      - run: npm run format:check
        continue-on-error: true
      # Non-blocking for the same reason: the ESLint config is out of step with the code (72 errors on main,
      # e.g. an unknown `import/first` rule and `no-undef` on NodeJS types). Fix the config, then make it blocking.
      - run: npm run lint
        continue-on-error: true
      - run: npm test --workspace backend
      - run: npm run build

  etl-python:
    name: ETL pipeline + smoke script (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 07ps-sales-dashboard-app/data/etl/requirements.txt
      - run: pip install -r data/etl/requirements.txt pytest
      - name: ETL unit tests (incl. etl_run_log, freshness, input checks) and the ETL API
        working-directory: 07ps-sales-dashboard-app/data/etl
        # tests/test_product_dimension.py is deselected: its expectations predate the current Dim_Product /
        # QA_UnmappedProducts schema and fail on main independent of the deployment work (see
        # docs/DEPLOYMENT.md "Known issues"). Remove the --ignore once those tests are updated.
        run: python -m pytest -q tests api/tests --ignore=tests/test_product_dimension.py
      - name: Post-deploy smoke script tests
        run: python -m pytest -q scripts/test_post_deploy_check.py

  ingestion-lint:
    name: Data ingestion (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff black -r data/ingestion/requirements.txt
      - run: ruff check data/ingestion --config pyproject.toml
      - run: black --check data/ingestion

  sql:
    name: Warehouse migration 0022 (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ps_warehouse_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymysql cryptography
      # Migrations 0018+ reference tables the ETL creates (Dim_Segment, ...), so the whole folder cannot run
      # on an empty database; the new, self-contained, idempotent migration is applied twice instead.
      - name: Apply 0022_etl_run_log.sql twice (must be re-runnable)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ps_warehouse_ci
        run: |
          python data/warehouse/apply_migrations.py 0022_etl_run_log.sql
          python data/warehouse/apply_migrations.py 0022_etl_run_log.sql

  docker:
    name: Docker images build + compose file validates
    runs-on: ubuntu-latest
    needs: [node, etl-python]
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid with the example env files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp data/etl/.env.example data/etl/.env
          cp data/ingestion/.env.example data/ingestion/.env
          docker compose config -q
      - name: Build all images
        run: docker compose build
