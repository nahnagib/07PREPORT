# Nginx config for the 07ps Sales Dashboard - runs on the VPS host (not inside docker-compose),
# reverse-proxying to the containers' localhost-bound ports (see docker-compose.yml: backend on
# 4000, frontend on 3000, both `127.0.0.1:PORT:PORT` - not reachable from outside the host at all
# without this). Install: see docs/vps-deployment.md.
#
# Subdomain-based routing, not path-based (/api/): backend routes are mounted at root paths
# (/health, /tachometer, /admin/etl-runs, etc. - see backend/src/server.ts), not under an /api/
# prefix, and some of those paths collide with frontend page routes (e.g. /admin/etl-runs is both
# a Next.js page and a backend API route - frontend/src/app/admin/etl-runs/page.tsx). A single
# server rewriting /api/ can't disambiguate those, so the frontend calls the backend as a
# genuinely separate origin (NEXT_PUBLIC_API_BASE_URL) instead.
events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=app_limit:10m rate=30r/s;

    # =========================================================================
    # Main domain: frontend (Next.js)
    # =========================================================================
    server {
        listen 80;
        server_name benmussa-invest.com www.benmussa-invest.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name benmussa-invest.com www.benmussa-invest.com;

        ssl_certificate /etc/letsencrypt/live/benmussa-invest.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/benmussa-invest.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;

        location / {
            limit_req zone=app_limit burst=50 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }
    }

    # =========================================================================
    # api.<domain>: backend (Express)
    # =========================================================================
    server {
        listen 80;
        server_name api.benmussa-invest.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.benmussa-invest.com;

        ssl_certificate /etc/letsencrypt/live/benmussa-invest.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/benmussa-invest.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        gzip on;
        gzip_types text/plain application/json;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # Optional: expose the ETL Flask API externally. Off by default - only etl-worker (inside the
    # Docker network) needs to reach it; nothing external should. Uncomment and add HTTP basic auth
    # (or an IP allowlist) on top of its own Bearer-key auth if you have a real reason to reach it
    # from outside the VPS (e.g. debugging from your workstation).
    # =========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name etl-api.benmussa-invest.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/benmussa-invest.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/benmussa-invest.com/privkey.pem;
    #
    #     location / {
    #         auth_basic "ETL API - restricted";
    #         auth_basic_user_file /etc/nginx/.htpasswd;
    #         proxy_pass http://127.0.0.1:5001;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    # }
}
