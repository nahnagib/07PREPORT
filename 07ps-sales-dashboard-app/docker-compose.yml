# Deployment target: Libyan Spider VPS (root access)
version: '3.9'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options: { max-size: '10m', max-file: '3' }

  etl-api:
    build:
      context: .
      dockerfile: ./data/etl/Dockerfile.api
    restart: unless-stopped
    env_file: ./data/etl/.env
    volumes:
      - /root/07PREPORT/Input:/data/Input:ro
    ports:
      - '127.0.0.1:5001:5001'
    logging:
      driver: 'json-file'
      options: { max-size: '50m', max-file: '5' }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.18.0.101
    ports:
      - '0.0.0.0:4001:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options: { max-size: '50m', max-file: '5' }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://dashboards.benmussaholding.com/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://dashboards.benmussaholding.com/api}
    networks:
      default:
        ipv4_address: 172.18.0.100
    ports:
      - '0.0.0.0:8080:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode<500?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options: { max-size: '50m', max-file: '5' }

  etl-worker:
    build:
      context: .
      dockerfile: ./Dockerfile.worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      ETL_API_URL: http://etl-api:5001
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      etl-api:
        condition: service_started
    logging:
      driver: 'json-file'
      options: { max-size: '50m', max-file: '5' }

  ingestion:
    build: ./data/ingestion
    restart: unless-stopped
    env_file: ./data/ingestion/.env
    volumes:
      - /root/07PREPORT/Input:/data/Input:ro

volumes:
  redisdata:
    driver: local

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
