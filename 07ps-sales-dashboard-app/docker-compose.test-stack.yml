# Local TEST stack, run next to production on the same PC. Start/stop it with test-stack-start.cmd /
# test-stack-stop.cmd in the repo root (docs/product_data_runbook.md, "Local test stack").
#
#   docker compose -p 07ps-test -f docker-compose.yml -f docker-compose.test-stack.yml ...
#
# - Own project name (07ps-test), network, volumes and images (IMAGE_TAG=test), so production's containers,
#   volumes and 07ps/*:local images are never touched.
# - Own MySQL (service test-mysql) holding a COPY of the production database. Every service reaches it as
#   test-mysql:3306 on the stack's own network; nothing points at the production MySQL.
# - Ports: frontend http://localhost:3202, backend http://localhost:4201, ETL API http://localhost:4202,
#   MySQL 127.0.0.1:33309.
# - The ETL input folder is mounted read-only, and the ETL schedules are off (start runs from the
#   ETL Control Center at http://localhost:3202/Dashboard/admin/etl-control).
services:
  test-mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ['--lower_case_table_names=1', '--max_allowed_packet=256M']
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: powerbi_data
      MYSQL_USER: ${TEST_DB_USER:?run test-stack-start.cmd}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?run test-stack-start.cmd}
      TZ: ${APP_TIMEZONE:-Africa/Tripoli}
    volumes:
      - test_mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:33309:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: { driver: 'json-file', options: { max-size: '10m', max-file: '2' } }

  redis:
    ports: !override []

  etl-api:
    environment:
      DB_HOST: test-mysql
      DB_PORT: '3306'
    volumes: !override
      - ${ETL_INPUT_HOST_DIR:-../Input}:/etl/input:ro
      - test_etl_input_backups:/etl/input_backups
      - test_etl_output:/etl/output
    ports: !override
      - '127.0.0.1:4202:5001'
    depends_on:
      test-mysql:
        condition: service_healthy

  backend:
    environment:
      DB_HOST: test-mysql
      DB_PORT: '3306'
      ETL_SCHEDULE_INCREMENTAL_ENABLED: 'false'
      ETL_SCHEDULE_FULL_ENABLED: 'false'
      FRONTEND_ORIGIN: http://localhost:3202
    ports: !override
      - '127.0.0.1:4201:4000'
    networks: !override
      default:
        ipv4_address: 172.29.0.101
    depends_on:
      test-mysql:
        condition: service_healthy

  etl-worker:
    environment:
      DB_HOST: test-mysql
      DB_PORT: '3306'
      ETL_SCHEDULE_INCREMENTAL_ENABLED: 'false'
      ETL_SCHEDULE_FULL_ENABLED: 'false'
    depends_on:
      test-mysql:
        condition: service_healthy

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4201
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4201
    ports: !override
      - '127.0.0.1:3202:3000'
    networks: !override
      default:
        ipv4_address: 172.29.0.100

volumes:
  test_mysql_data:
  test_etl_input_backups:
  test_etl_output:

networks:
  default:
    ipam:
      config: !override
        - subnet: 172.29.0.0/16
