; Weekly Sales Collection & Aging Report: settings (no secrets in this file).
; Paths are relative to this file.

[odoo]
; Where the Odoo credentials come from. A .env file next to this one is read first, then these ('|' separated).
; The ETL's file already holds ODOO_URL / ODOO_DB / ODOO_USER / ODOO_API_KEY, so nothing new is needed.
env_file = ../../data/etl/.env | ../../backend/.env
; Uses ODOO_DEBT_LOGIN / ODOO_DEBT_API_KEY (the finance bot user) when they are set, else ODOO_USER / ODOO_API_KEY.
credential_profile = debt
; Majaal = 1, TIKA = 3 (ODOO_COMPANY_IDS in the environment wins)
company_ids = 1,3
lang = en_US
timeout_seconds = 60
max_retries = 5

[scope]
; Same rules as the Debt Report (docs/receivables-etl.md)
intercompany_partner_ids = 15905,15907
exclude_intercompany = true
; The dashboard's team mapping: invoices of teams in the segments below are left out
sales_team_file = ../../../Input/SalesTeam.xlsx
exclude_segments = Backoffice | Inter Company
; ...and of these team names (exact match, Odoo or SalesTeam.xlsx name)
exclude_team_names = مبيعات BMH | مبيعات الادارة المالية | SALES

[report]
; The week runs from the day after the previous week end up to this day (Sunday -> Saturday)
week_end_day = saturday
; Weeks shown in the trend table (the first one is the report week)
trend_weeks = 4
; Weekly target = this % of the overdue balance at the start of the week (override per person in [targets])
weekly_target_pct_of_overdue = 20
; Next-week plan: how much the overdue balance should shrink
next_week_overdue_reduction_pct = 10
priority_rows = 15
; Empty = everyone with debt. Otherwise names (contains) or Odoo user ids, '|' separated, e.g.  Marwan | 42
salespeople =
; Skip people whose outstanding is below this amount
min_outstanding = 1
; Also produce a report for debt with no salesperson ("Unassigned")
include_unassigned = true
output_dir = output
log_dir = logs

[targets]
; Fixed weekly targets per salesperson (overrides the % rule), e.g.
; Marwan = 140000

[email]
enabled = true
; outlook = send through the Outlook (classic) app on this PC, from the account signed in there (no password needed)
; smtp    = send through the SMTP_* settings in .env (Microsoft 365 blocks this for most companies)
method = outlook
; WHO gets WHICH report: salesperson name / Odoo user id -> email, CC, Send Yes/No, weekly target.
; When this file exists it decides everything below; [email_overrides] and [targets] are then only fallbacks.
recipients_file = ../../../Input/AR_Report_Recipients.xlsx
; If a row has Send Report = Yes but no Email, use the email of the Odoo user instead (default: do not send)
use_odoo_email_if_blank = false
send_to_salesperson = true
; Comma-separated
cc =
team_summary_to =

[email_overrides]
; Send a salesperson's report to a different address (name or Odoo user id = email), e.g.
; Marwan = marwan.sales@yourcompany.ly
